tool: nimble
name: Nimble
env:
- NIMBLE_API_KEY
setups:
  nimble-agents:
    class: main
    endpoint: POST https://sdk.nimbleway.com/v2/agents/runs
    settings:
      use_case: enrichment
      effort: high
      output_schema: funding
    pricing:
      usd: 0.5
      unit: agent run
      source: https://docs.nimbleway.com/nimble-sdk/web-search-agents/efforts
      note: Effort high, $0.50 per run.
  nimble-agents-medium:
    class: main
    endpoint: POST https://sdk.nimbleway.com/v2/agents/runs
    settings:
      use_case: enrichment
      effort: medium
      output_schema: funding
    pricing:
      usd: 0.1
      unit: agent run
      source: https://docs.nimbleway.com/nimble-sdk/web-search-agents/efforts
  nimble-lite:
    class: main
    endpoint: POST https://sdk.nimbleway.com/v2/search
    env:
    - NIMBLE_API_KEY
    - OPENAI_API_KEY
    settings:
      search_depth: lite
      focus: general
      full_content: false
      max_results: 10
      extractor:
        model: gpt-5.6-terra
        reasoning_effort: medium
    pricing:
      usd: 0.0011
      unit: search
      source: https://www.nimbleway.com/pricing
      note: Extraction-model tokens are billed on top.
  nimble-standard:
    class: main
    endpoint: POST https://sdk.nimbleway.com/v2/search
    env:
    - NIMBLE_API_KEY
    - OPENAI_API_KEY
    settings:
      search_depth: standard
      focus: general
      full_content: false
      max_results: 10
      extractor:
        model: gpt-5.6-terra
        reasoning_effort: medium
    pricing:
      usd: 0.005
      unit: search
      source: https://www.nimbleway.com/pricing
      note: Extraction-model tokens are billed on top.
