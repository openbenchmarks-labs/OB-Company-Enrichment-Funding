tool: seltz
name: Seltz
env:
- SELTZ_API_KEY
setups:
  seltz-companies:
    class: main
    endpoint: POST https://api.seltz.ai/v1/answer
    settings:
      scope: companies
      response_format: json_schema
      output_schema: funding
    pricing:
      usd: 0.007
      unit: request
      source: https://docs.seltz.ai/pricing
      note: Answer, Pro tier, $7 per 1,000. The request names no tier, and the API resolves an unset tier to pro.
    note: If the API rejects json_schema, the request is repeated with response_format json_object.
  seltz-companies-structured:
    class: main
    endpoint: POST https://api.seltz.ai/v1/search
    settings:
      scope: companies
      max_results: 10
      query: <company name> <domain>
      fields:
        properties:
        - company.name
        - company.website
        - company.funding_rounds
        content: true
    pricing:
      usd: 0.005
      unit: request
      source: https://docs.seltz.ai/pricing
      note: Search, Pro tier, $5 per 1,000. The request names no tier, and the API resolves an unset tier to pro.
    note: Reads the company's structured record with no model.
  seltz-news:
    class: main
    endpoint: POST https://api.seltz.ai/v1/answer
    settings:
      scope: news
      response_format: json_schema
      output_schema: funding
    pricing:
      usd: 0.007
      unit: request
      source: https://docs.seltz.ai/pricing
      note: Answer, Pro tier, $7 per 1,000. The request names no tier, and the API resolves an unset tier to pro.
    note: If the API rejects json_schema, the request is repeated with response_format json_object.
  seltz-search-news:
    class: main
    endpoint: POST https://api.seltz.ai/v1/search
    env:
    - SELTZ_API_KEY
    - OPENAI_API_KEY
    settings:
      scope: news
      max_results: 10
      extractor:
        model: gpt-5.6-terra
        reasoning_effort: medium
    pricing:
      usd: 0.005
      unit: request
      source: https://docs.seltz.ai/pricing
      note: Search, Pro tier, $5 per 1,000. The request names no tier, and the API resolves an unset tier to pro. Extraction-model tokens are billed on top.
  seltz-search-web:
    class: main
    endpoint: POST https://api.seltz.ai/v1/search
    env:
    - SELTZ_API_KEY
    - OPENAI_API_KEY
    settings:
      scope: web
      max_results: 10
      extractor:
        model: gpt-5.6-terra
        reasoning_effort: medium
    pricing:
      usd: 0.005
      unit: request
      source: https://docs.seltz.ai/pricing
      note: Search, Pro tier, $5 per 1,000. The request names no tier, and the API resolves an unset tier to pro. Extraction-model tokens are billed on top.
  seltz-web:
    class: main
    endpoint: POST https://api.seltz.ai/v1/answer
    settings:
      scope: web
      response_format: json_schema
      output_schema: funding
    pricing:
      usd: 0.007
      unit: request
      source: https://docs.seltz.ai/pricing
      note: Answer, Pro tier, $7 per 1,000. The request names no tier, and the API resolves an unset tier to pro.
