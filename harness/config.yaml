subject: tool_call
fields:
- latest_stage
- amount
- announced_on
boards:
- enrichment
- freshness
model:  # per setup, copied from tools/*.yaml; extraction models are not in the probe, so the lock digests them here
  firecrawl: spark-1-mini
  firecrawl-spark-2: spark-2
  nimble-lite: gpt-5.6-terra
  nimble-standard: gpt-5.6-terra
  parallel-responses-medium: parallel
  seltz-search-news: gpt-5.6-terra
  seltz-search-web: gpt-5.6-terra
effort:  # per setup, copied from tools/*.yaml
  exa-agent: medium
  nimble-agents: high
  nimble-agents-medium: medium
  nimble-lite: medium
  nimble-standard: medium
  parallel-responses-medium: medium
  seltz-search-news: medium
  seltz-search-web: medium
limits:
  research_timeout_seconds: 180  # harness/adapters/_research.py TIMEOUT; a setup's settings.timeout_seconds overrides it
  research_attempts: 4  # harness/adapters/_research.py ATTEMPTS
  extraction_timeout_seconds: 180  # harness/adapters/_extraction.py default; a setup's extractor.timeout_seconds overrides it
  extraction_max_output_tokens: 4000  # harness/adapters/_extraction.py default; a setup's extractor.max_output_tokens overrides it
